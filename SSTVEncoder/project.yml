name: SSTVEncoder

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  SSTVKit:
    path: ../SSTVKit

targets:
  SSTVEncoder:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    resources:
      - path: Resources/Generated/Assets.xcassets
    dependencies:
      - package: SSTVKit
        product: SSTVKit
    info:
      path: App/Info.plist
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleDisplayName: SSTV Encoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        MinimumOSVersion: $(IPHONEOS_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: 用于在您明确启动接收后解码 SSTV 或 HF Fax 音频；原始音频不会保存或上传。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.times1368.sstvencoder
        PRODUCT_NAME: SSTVEncoder
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SSTVEncoderTests

  SSTVEncoderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../SSTVEncoderTests
    dependencies:
      - target: SSTVEncoder
      - package: SSTVKit
        product: SSTVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.times1368.sstvencoder.tests
        GENERATE_INFOPLIST_FILE: true
