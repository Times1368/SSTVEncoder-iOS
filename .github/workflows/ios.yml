name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: SSTVEncoder
  PROJECT_PATH: SSTVEncoder/SSTVEncoder.xcodeproj
  SCHEME: SSTVEncoder
  IPA_NAME: SSTVEncoder.ipa

jobs:
  baseline_capture:
    name: Capture procedural encoder baselines
    if: github.ref == 'refs/heads/ui/baseline'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out capture branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Xcode 15.0.1 and verify Swift 5.9
        timeout-minutes: 2
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer
          swift --version
          swift --version | /usr/bin/grep -E "Swift version 5\.9"

      - name: Verify production codec and App sources are untouched
        timeout-minutes: 2
        run: |
          GIT_TERMINAL_PROMPT=0 git diff --exit-code \
            d7453dec4ab35bff6dd56cd63383362aa0bc76ad HEAD -- \
            SSTVKit/Sources/SSTVKit SSTVEncoder

      - name: Test baseline capture scripts
        timeout-minutes: 2
        run: python3 -m unittest scripts.tests.test_baseline_capture -v

      - name: Build the procedural baseline generator
        timeout-minutes: 2
        run: python3 scripts/capture_baselines.py build

      - name: Test coordinate fixtures and row-order measurement
        timeout-minutes: 2
        run: python3 scripts/capture_baselines.py test-fixture

      - name: Capture Robot 36 and diagnose row order
        timeout-minutes: 2
        run: python3 scripts/capture_baselines.py capture --mode robot36Color --output "$RUNNER_TEMP/sstv-baseline"

      - name: Capture Martin M1 and diagnose row order
        timeout-minutes: 2
        run: python3 scripts/capture_baselines.py capture --mode martinM1 --output "$RUNNER_TEMP/sstv-baseline"

      - name: Capture PD 120 and diagnose row order
        timeout-minutes: 2
        run: python3 scripts/capture_baselines.py capture --mode pd120 --output "$RUNNER_TEMP/sstv-baseline"

      - name: Verify WAV format and publish three SHA-256 hashes
        timeout-minutes: 2
        run: |
          python3 scripts/capture_baselines.py summarize --output "$RUNNER_TEMP/sstv-baseline"
          cd "$RUNNER_TEMP/sstv-baseline"
          /usr/bin/shasum -a 256 -c SHA256SUMS

      - name: Upload baseline WAVs, hashes and separate row-order diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sstv-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/sstv-baseline
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Report codec-only row order without blocking encoder baselines
        continue-on-error: true
        timeout-minutes: 2
        run: python3 scripts/capture_baselines.py check-row-order --output "$RUNNER_TEMP/sstv-baseline"

  compatibility:
    name: Xcode 15.0.1 / Swift 5.9 / iOS 17 compatibility
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 15.0.1 and verify Swift 5.9
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer
          xcodebuild -version
          swift --version
          swift --version | /usr/bin/grep -E "Swift version 5\.9"

      - name: Generate AppIcon asset catalog
        run: |
          python3 -m venv "$RUNNER_TEMP/app-icon-venv"
          "$RUNNER_TEMP/app-icon-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "Pillow==12.3.0"
          "$RUNNER_TEMP/app-icon-venv/bin/python" scripts/generate_app_icon.py

      - name: Validate repository contracts
        run: python3 scripts/validate_project.py --root "$GITHUB_WORKSPACE"

      - name: Test CI validation scripts
        run: |
          "$RUNNER_TEMP/app-icon-venv/bin/python" -m unittest discover -s scripts/tests -v

      - name: Run SSTVKit tests with SwiftPM
        env:
          SSTV_RECEIVE_QUALITY_OUTPUT: ${{ runner.temp }}/receive-quality-xcode15
          SSTV_VERIFY_ENCODER_BASELINE: "1"
        run: |
          mkdir -p "$SSTV_RECEIVE_QUALITY_OUTPUT"
          xcodebuild -version > "$SSTV_RECEIVE_QUALITY_OUTPUT/toolchain.txt"
          swift --version >> "$SSTV_RECEIVE_QUALITY_OUTPUT/toolchain.txt"
          printf 'commit=%s\nconfiguration=Release\n' "$GITHUB_SHA" >> "$SSTV_RECEIVE_QUALITY_OUTPUT/toolchain.txt"
          swift test --package-path SSTVKit --configuration release --parallel

      - name: Upload Swift 5.9 receive quality and encoder integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receive-quality-xcode15-${{ github.sha }}
          path: ${{ runner.temp }}/receive-quality-xcode15
          if-no-files-found: warn
          retention-days: 30

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: SSTVEncoder
        run: xcodegen generate --spec project.yml

      - name: Select an available iOS 17 iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          python3 scripts/select_simulator.py "$RUNNER_TEMP/available-simulators.json" \
            --runtime-major 17 \
            --github-output "$GITHUB_OUTPUT"

      - name: Run app tests on iOS 17
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-compatibility" \
            -only-testing:SSTVEncoderTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  tests:
    name: Xcode 16.4 tests
    needs: compatibility
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Generate AppIcon asset catalog
        run: |
          python3 -m venv "$RUNNER_TEMP/app-icon-venv"
          "$RUNNER_TEMP/app-icon-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "Pillow==12.3.0"
          "$RUNNER_TEMP/app-icon-venv/bin/python" scripts/generate_app_icon.py

      - name: Validate repository contracts
        run: python3 scripts/validate_project.py --root "$GITHUB_WORKSPACE"

      - name: Test CI validation scripts
        run: |
          "$RUNNER_TEMP/app-icon-venv/bin/python" -m unittest discover -s scripts/tests -v

      - name: Run SSTVKit tests with SwiftPM
        env:
          SSTV_RECEIVE_QUALITY_OUTPUT: ${{ runner.temp }}/receive-quality-xcode16
        run: |
          mkdir -p "$SSTV_RECEIVE_QUALITY_OUTPUT"
          xcodebuild -version > "$SSTV_RECEIVE_QUALITY_OUTPUT/toolchain.txt"
          swift --version >> "$SSTV_RECEIVE_QUALITY_OUTPUT/toolchain.txt"
          printf 'commit=%s\nconfiguration=Debug\n' "$GITHUB_SHA" >> "$SSTV_RECEIVE_QUALITY_OUTPUT/toolchain.txt"
          swift test --package-path SSTVKit --parallel

      - name: Upload current toolchain receive quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receive-quality-xcode16-${{ github.sha }}
          path: ${{ runner.temp }}/receive-quality-xcode16
          if-no-files-found: warn
          retention-days: 30

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: SSTVEncoder
        run: xcodegen generate --spec project.yml

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          python3 scripts/select_simulator.py "$RUNNER_TEMP/available-simulators.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run app tests
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tests" \
            -only-testing:SSTVEncoderTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  package:
    needs: tests
    name: Build and package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Generate AppIcon asset catalog
        run: |
          python3 -m venv "$RUNNER_TEMP/app-icon-venv"
          "$RUNNER_TEMP/app-icon-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "Pillow==12.3.0"
          "$RUNNER_TEMP/app-icon-venv/bin/python" scripts/generate_app_icon.py

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: SSTVEncoder
        run: xcodegen generate --spec project.yml

      - name: Build unsigned Release app for iOS devices
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-package" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Create manual Payload IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData-package/Build/Products/Release-iphoneos/SSTVEncoder.app"
          STAGING_PATH="$RUNNER_TEMP/ipa-staging"
          DIST_PATH="$GITHUB_WORKSPACE/dist"
          test -d "$APP_PATH"
          mkdir -p "$STAGING_PATH/Payload" "$DIST_PATH"
          COPYFILE_DISABLE=1 /usr/bin/ditto "$APP_PATH" "$STAGING_PATH/Payload/SSTVEncoder.app"
          cd "$STAGING_PATH"
          COPYFILE_DISABLE=1 /usr/bin/zip -qry -X "$DIST_PATH/$IPA_NAME" Payload/SSTVEncoder.app

      - name: Verify IPA and write integrity files
        run: |
          python3 scripts/verify_ipa.py "dist/$IPA_NAME" \
            --manifest dist/verification-manifest.json \
            --sha256-file "dist/$IPA_NAME.sha256"

      - name: Upload independent unsigned IPA artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: SSTVEncoder-iOS-unsigned-${{ github.sha }}
          path: |
            dist/SSTVEncoder.ipa
            dist/SSTVEncoder.ipa.sha256
            dist/verification-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify_artifact:
    needs: package
    name: Download and independently reverify artifact
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: SSTVEncoder-iOS-unsigned-${{ github.sha }}
          path: downloaded-artifact

      - name: Reverify downloaded IPA, checksum, and manifest
        run: |
          python3 scripts/verify_ipa.py downloaded-artifact/SSTVEncoder.ipa \
            --expected-manifest downloaded-artifact/verification-manifest.json \
            --expected-sha256-file downloaded-artifact/SSTVEncoder.ipa.sha256
